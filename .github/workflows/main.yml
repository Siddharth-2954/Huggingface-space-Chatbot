name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - master   

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://siddharth-bharadia:$HF_TOKEN@huggingface.co/spaces/siddharth-bharadia/Groq-Chatbot-Query-App hf-space

          rsync -av --delete \
            --exclude=".git" \
            --exclude=".github" \
            ./ hf-space/

          cd hf-space

          git add .
          git commit -m "Deploy from GitHub" || echo "No changes"

          git push
